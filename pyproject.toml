[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dradar-dashboard"
version = "0.2.0"
description = "Unofficial dashboard wrapper for Crowd Radar and the official DRadar CLI: IQ, recommendations and task workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "sdy623"}]
dependencies = ["aiohttp>=3.13.3,<4"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sdy623/dradar-dashboard"
Issues = "https://github.com/sdy623/dradar-dashboard/issues"

[project.scripts]
dradar-dashboard = "dradar_dashboard.cli:main"
dradar-dashboard-codex = "dradar_dashboard.cli:codex"
dradar-dashboard-claude = "dradar_dashboard.cli:claude"

[dependency-groups]
build = ["pyinstaller>=6.16,<7", "packaging>=24"]

[tool.hatch.build.targets.wheel]
packages = ["src/dradar_dashboard"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "dashboard.py", "pyproject.toml", "uv.lock", "LICENSE", "README.md", "CHANGELOG.md", "skills", ".github"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "zhongce-radar-cli"
version = "0.1.0"
description = "Cross-platform terminal client for 众测雷达: IQ, cost efficiency, tasks and contribution rankings"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "sdy623"}]
dependencies = ["aiohttp>=3.13.3,<4"]
classifiers = [
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sdy623/zhongce-radar-cli"
Issues = "https://github.com/sdy623/zhongce-radar-cli/issues"

[project.scripts]
radar = "zhongce_radar.cli:main"
radar-codex = "zhongce_radar.cli:codex"
radar-claude = "zhongce_radar.cli:claude"
zhongce-radar-cli = "zhongce_radar.cli:main"

[dependency-groups]
build = ["pyinstaller>=6.16,<7", "packaging>=24"]

[tool.hatch.build.targets.wheel]
packages = ["src/zhongce_radar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "radar.py", "pyproject.toml", "uv.lock", "LICENSE", "README.md", "CHANGELOG.md", "examples", ".github"]

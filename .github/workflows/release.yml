name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group build
      - run: uv run --locked python -m unittest discover -s tests
      - run: uv run --locked --group build python scripts/build_executable.py
      - if: runner.os == 'Linux'
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.whl
            dist/*.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.zip dist/*.tar.gz dist/*.whl > dist/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "DRadar Dashboard $GITHUB_REF_NAME" --notes "Dashboard wrapper for Crowd Radar and the official DRadar CLI. Includes IQ briefing, recommendations and task workflow skill. Native Windows/Linux/macOS executables and Python packages. See README for renamed uv/uvx entry points. No credentials are bundled."
